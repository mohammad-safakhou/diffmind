<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DiffMind Graph</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="simple-topbar">
    <h1>DiffMind Service Graph</h1>
    <div class="simple-actions">
      <label>
        Graph
        <select id="graphSelect"></select>
      </label>
      <button id="refreshBtn" type="button">Refresh</button>
      <button id="resetViewBtn" type="button">Reset View</button>
    </div>
  </header>

  <main class="simple-layout">
    <section class="simple-graph-panel">
      <div class="simple-legend">
        <span class="legend-item"><span class="dot exposure"></span> Exposure</span>
        <span class="legend-item"><span class="dot dependency"></span> Dependency</span>
        <span class="legend-item"><span class="dot selected"></span> Selected</span>
      </div>
      <div id="graphContainer" class="graph-container" aria-label="Exposure dependency graph">
        <svg id="graphSvg" class="graph-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
          <g id="viewport"></g>
        </svg>
      </div>
    </section>

    <aside class="simple-side-panel">
      <h2>Selection</h2>
      <pre id="selectionDetails">Click a node to see details.</pre>
      <h2>Summary</h2>
      <div id="summary"></div>
    </aside>
  </main>

  <span class="legacy-hidden" aria-hidden="true">Validate Operator SLA</span>

  <script src="/app.js" defer></script>
</body>
</html>
