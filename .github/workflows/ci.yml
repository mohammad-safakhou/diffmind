name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            internal/workspace/ui/web/package-lock.json
            internal/extractor/ui/web/package-lock.json
      - run: npm ci
        working-directory: internal/workspace/ui/web
      - run: npm audit --audit-level=low
        working-directory: internal/workspace/ui/web
      - run: npm run build
        working-directory: internal/workspace/ui/web
      - run: npm test
        working-directory: internal/workspace/ui/web
      - run: npm ci
        working-directory: internal/extractor/ui/web
      - run: npm audit --audit-level=low
        working-directory: internal/extractor/ui/web
      - run: npm run build
        working-directory: internal/extractor/ui/web
      - run: npm test
        working-directory: internal/extractor/ui/web
      - run: go test ./...
      - run: go test -race ./cmd/diffmind ./internal/workspace/agentapi ./internal/workspace/agenthost ./internal/workspace/query ./internal/workspace/mcpserver ./internal/workspace/ui ./internal/workspace/store ./internal/workspace/backup ./internal/workspace/homelock
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go run ./cmd/diffmind pack lint ./packs
      - run: go run ./cmd/diffmind pack test ./packs
      - run: sh scripts/test-install.sh
      - run: sh scripts/test-demo.sh
      - name: Validate scheduled maintenance units
        run: |
          sudo install -d -m 0755 /usr/local/libexec/diffmind
          sudo install -m 0755 scripts/backup-systemd.sh /usr/local/libexec/diffmind/backup-systemd.sh
          systemd-analyze verify deploy/systemd/diffmind-backup.service deploy/systemd/diffmind-backup.timer
      - run: ruby -c Formula/diffmind.rb
      - run: go build ./cmd/diffmind

  native-release-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and test native release candidate without publishing
        shell: bash
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags '-X main.version=0.0.0-ci' -o dist/package/diffmind ./cmd/diffmind
          platform="$(go env GOOS)_$(go env GOARCH)"
          go run ./scripts/release-check --package-binary dist/package/diffmind --archive "dist/diffmind_0.0.0-ci_${platform}.tar.gz" --version 0.0.0-ci
