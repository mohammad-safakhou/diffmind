name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            internal/workspace/ui/web/package-lock.json
            internal/extractor/ui/web/package-lock.json
      - run: npm ci
        working-directory: internal/workspace/ui/web
      - run: npm run build
        working-directory: internal/workspace/ui/web
      - run: npm ci
        working-directory: internal/extractor/ui/web
      - run: npm run build
        working-directory: internal/extractor/ui/web
      - run: go test ./...
      - run: go build ./cmd/diffmind
