name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          gofmt -w $(find . -name '*.go' -not -path './vendor/*')
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Corpus Regression
        run: |
          go run ./cmd/extractor corpus --manifest corpus/manifest.fixtures.json --out .diffmind/corpus-fixtures
          go run ./cmd/extractor golden --report .diffmind/corpus-fixtures/report.json --golden corpus/golden/fixtures_summary.json
