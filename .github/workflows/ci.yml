name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            internal/workspace/ui/web/package-lock.json
            internal/extractor/ui/web/package-lock.json
      - run: npm ci
        working-directory: internal/workspace/ui/web
      - run: npm audit --audit-level=low
        working-directory: internal/workspace/ui/web
      - run: npm run build
        working-directory: internal/workspace/ui/web
      - run: npm ci
        working-directory: internal/extractor/ui/web
      - run: npm audit --audit-level=low
        working-directory: internal/extractor/ui/web
      - run: npm run build
        working-directory: internal/extractor/ui/web
      - run: npm test
        working-directory: internal/extractor/ui/web
      - run: go test ./...
      - run: go test -race ./internal/workspace/query ./internal/workspace/mcpserver ./internal/workspace/ui
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go run ./cmd/diffmind pack lint ./packs
      - run: go run ./cmd/diffmind pack test ./packs
      - run: sh scripts/test-install.sh
      - run: go build ./cmd/diffmind
